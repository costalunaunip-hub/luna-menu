/* Layout v3: home = photo hero → tools → grid of category cards (one tap opens a category page).
   Category page = sticky top bar (back · name · all categories) → list → prev/next → legal notes.
   Item tap = bottom sheet (photo if any, description, allergens, share). Hash routes: #<cat>, #it-<id>, #preview[/…].
   Data comes from menu.json at runtime; nothing about the menu is hardcoded here. */
@font-face{font-family:"Fraunces";font-style:normal;font-weight:600;font-display:swap;src:url(fraunces-600.woff2) format("woff2")}
:root{
  --bg:#f3ebdb; --bg-rgb:243,235,219; --bg2:#ece1cc;
  --card:#fffdf8; --line:rgba(88,66,36,.12); --hair:rgba(88,66,36,.10);
  --ink:#22302f; --muted:#5b6866;
  --teal:#2f6b66; --teal-ink:#245a55; --teal-soft:rgba(47,107,102,.10); --on-teal:#fff;
  --terra:#a8502a; --terra-soft:rgba(168,80,42,.10);
  --tag-bg:#f5e6cd; --tag-ink:#6b431f; --tag-line:#e3cda6;
  --field:#fffdf8; --focus:#2f6b66;
  --shadow:0 1px 2px rgba(50,36,12,.05),0 10px 28px -14px rgba(50,36,12,.22);
  --skeleton:rgba(88,66,36,.08); --skeleton-hi:rgba(255,255,255,.55);
  --scrim:rgba(20,30,30,.32);
  --ok:#2e7d4f; --ok-ring:rgba(46,125,79,.45); --warn:#b07a12;
  --display:"Fraunces",Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16201f; --bg-rgb:22,32,31; --bg2:#1b2726;
  --card:#1f2b2a; --line:rgba(237,230,216,.12); --hair:rgba(237,230,216,.09);
  --ink:#ede6d8; --muted:#a9b3b0;
  --teal:#7fb8b2; --teal-ink:#9fd0ca; --teal-soft:rgba(127,184,178,.14); --on-teal:#10201e;
  --terra:#e0916a; --terra-soft:rgba(224,145,106,.14);
  --tag-bg:#2e2a22; --tag-ink:#e3cda6; --tag-line:#4a4232;
  --field:#1a2423; --focus:#9fd0ca;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px -14px rgba(0,0,0,.5);
  --skeleton:rgba(237,230,216,.08); --skeleton-hi:rgba(237,230,216,.10);
  --scrim:rgba(0,0,0,.5);
  --ok:#8fd4a6; --ok-ring:rgba(143,212,166,.45); --warn:#e6c26a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#16201f; --bg-rgb:22,32,31; --bg2:#1b2726;
  --card:#1f2b2a; --line:rgba(237,230,216,.12); --hair:rgba(237,230,216,.09);
  --ink:#ede6d8; --muted:#a9b3b0;
  --teal:#7fb8b2; --teal-ink:#9fd0ca; --teal-soft:rgba(127,184,178,.14); --on-teal:#10201e;
  --terra:#e0916a; --terra-soft:rgba(224,145,106,.14);
  --tag-bg:#2e2a22; --tag-ink:#e3cda6; --tag-line:#4a4232;
  --field:#1a2423; --focus:#9fd0ca;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 28px -14px rgba(0,0,0,.5);
  --skeleton:rgba(237,230,216,.08); --skeleton-hi:rgba(237,230,216,.10);
  --scrim:rgba(0,0,0,.5);
  --ok:#8fd4a6; --ok-ring:rgba(143,212,166,.45); --warn:#e6c26a;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;font-family:var(--body);font-size:16px;color:var(--ink);background:var(--bg);line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
img{max-width:100%}

/* ---------- page transitions (View Transitions API; no-op where unsupported) ---------- */
@keyframes vt-in-r{from{opacity:0;transform:translateX(28px)}}
@keyframes vt-out-l{to{opacity:0;transform:translateX(-18px)}}
@keyframes vt-in-l{from{opacity:0;transform:translateX(-28px)}}
@keyframes vt-out-r{to{opacity:0;transform:translateX(18px)}}
html[data-dir="fwd"]::view-transition-old(root){animation:vt-out-l .18s ease both}
html[data-dir="fwd"]::view-transition-new(root){animation:vt-in-r .26s cubic-bezier(.2,.7,.2,1) both}
html[data-dir="back"]::view-transition-old(root){animation:vt-out-r .18s ease both}
html[data-dir="back"]::view-transition-new(root){animation:vt-in-l .26s cubic-bezier(.2,.7,.2,1) both}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- HERO ---------- */
.hero{position:relative;height:clamp(270px,72vw,380px);background:#9cc0bc;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 16px 16px}
.hero img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:center 45%;z-index:0}
.hero::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,30,30,.10) 0%,rgba(20,30,30,0) 30%,rgba(var(--bg-rgb),0) 50%,rgba(var(--bg-rgb),.90) 76%,var(--bg) 100%)}
.hero>*{position:relative;z-index:1}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(2.4rem,11vw,3.4rem);line-height:1;margin:0;color:var(--ink);letter-spacing:-.01em;text-wrap:balance}
.hero .sub{margin-top:8px;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--teal-ink);font-weight:600}

/* ---------- LANGUAGE ---------- */
.langbar{display:grid;grid-template-columns:repeat(3,max-content);justify-content:center;gap:6px 8px;padding:12px 12px 0;max-width:760px;margin:0 auto}
@media(min-width:480px){.langbar{grid-template-columns:repeat(6,max-content)}}
.langbar button{font-size:.8rem;font-weight:600;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:36px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,border-color .15s}
.langbar button .flag{font-size:1rem;line-height:1}
.langbar button.active{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.nota{font-size:.8rem;color:var(--terra);margin-top:3px;font-weight:600}

/* ---------- ANNOUNCEMENT ---------- */
.announce{max-width:760px;margin:12px auto 0;padding:0 14px}
.announce div{display:flex;gap:10px;align-items:flex-start;background:var(--terra-soft);border:1px solid var(--terra);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:.92rem;line-height:1.4}
.announce .ic{flex:0 0 auto}
.announce p{margin:0;flex:1 1 auto;min-width:0}
.announce button{flex:0 0 auto;border:none;background:none;width:32px;height:32px;margin:-6px -6px -6px 0;border-radius:50%;cursor:pointer;color:var(--muted)}

/* ---------- TOOLS ---------- */
.tools{max-width:760px;margin:12px auto 0;padding:0 14px;display:flex;gap:8px;align-items:center}
.search{flex:1 1 auto;min-width:0;position:relative}
.search input{width:100%;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:10px 40px 10px 40px;font:inherit;font-size:1rem}
.search input::placeholder{color:var(--muted)}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.search .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:none;border-radius:50%;cursor:pointer;color:var(--muted);font-size:1.1rem}
.iconbtn{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:1.05rem;color:var(--teal-ink)}
.fwrap{max-width:760px;margin:10px auto 0;padding:0 14px}
.fbtn{border:1px solid var(--tag-line);background:var(--tag-bg);color:var(--tag-ink);border-radius:999px;min-height:36px;padding:6px 12px 6px 10px;font-size:.8rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .15s,color .15s,border-color .15s}
.fbtn .n{min-width:20px;height:20px;border-radius:999px;background:var(--terra);color:#fff;font-size:.7rem;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.fbtn .chev{transition:transform .2s;display:inline-flex}
.fbtn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:10px}
.filters .lbl{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.filters button{border:1px solid var(--tag-line);background:var(--tag-bg);color:var(--tag-ink);border-radius:999px;min-height:32px;padding:4px 11px;font-size:.78rem;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.filters button[aria-pressed="true"]{background:var(--terra);border-color:var(--terra);color:#fff;text-decoration:line-through;text-decoration-thickness:2px}
.status{max-width:760px;margin:8px auto 0;padding:0 14px;font-size:.82rem;color:var(--muted);min-height:1.2em}
.status:empty{display:none}
.status b{color:var(--ink);font-weight:600}
.status button{border:none;background:none;color:var(--teal-ink);font-weight:600;text-decoration:underline;cursor:pointer;padding:0 0 0 6px}

/* ---------- HOME: category grid ---------- */
.wrap{max-width:760px;margin:0 auto;padding:4px 14px 72px}
.grp{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px;scroll-margin-top:12px}
.grp .gk{font-size:.74rem;font-weight:600;letter-spacing:.01em;text-transform:none;color:var(--teal-ink);white-space:nowrap}
.grp .gk.off{color:var(--terra)}
.grp .gk:empty{display:none}
.gjump{margin-top:14px}
.gjump button{white-space:nowrap;font-size:.8rem;font-weight:600;color:var(--teal-ink);background:var(--card);border:1px solid var(--line);border-radius:999px;min-height:36px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.gjump+.grp{margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.grp+.grid{margin-top:0}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}
@media(max-width:330px){.grid{grid-template-columns:1fr}}
.ccard{position:relative;display:flex;flex-direction:column;gap:4px;min-height:124px;padding:13px 14px 12px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);text-decoration:none;color:inherit;overflow:hidden;transition:transform .14s,box-shadow .14s;will-change:transform}
.ccard:active{transform:scale(.97)}
@media(hover:hover){.ccard:hover{transform:translateY(-2px)}}
.ccard .cico{width:40px;height:40px;border-radius:12px;background:var(--teal-soft);color:var(--teal-ink);display:inline-flex;align-items:center;justify-content:center;font-size:1.25rem;margin-bottom:6px}
.ccard .cico svg{width:22px;height:22px}
.ccard .ctitle{font-family:var(--display);font-weight:600;font-size:1.08rem;line-height:1.15;color:var(--ink);margin-top:auto;text-wrap:balance;letter-spacing:-.005em}
.ccard .cmeta{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-ink);font-weight:700}
.ccard .cprev{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.ccard .arrow{position:absolute;top:13px;right:12px;color:var(--muted);opacity:.55}
.ccard.photo{min-height:156px;justify-content:flex-end;border-color:transparent}
.ccard.photo img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0}
.ccard.photo::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(180deg,rgba(10,18,18,.05) 20%,rgba(10,18,18,.72) 100%);z-index:1}
.ccard.photo>*{position:relative;z-index:2}
.ccard.photo .ctitle,.ccard.photo .cprev{color:#fff}
.ccard.photo .cmeta{color:#d7efe9}
.ccard.photo .cico{display:none}
.ccard.photo .arrow{position:absolute;z-index:2;color:#fff}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.grid.anim .ccard{animation:rise .42s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*28ms)}

/* ---------- results (home, while searching) ---------- */
.res{margin:22px 0 0}
.res .rh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 4px 6px}
.res .rh a{font-family:var(--display);font-weight:600;font-size:1.2rem;color:var(--terra);text-decoration:none}
.res .rh span{font-size:.74rem;color:var(--muted);white-space:nowrap}

/* ---------- CATEGORY PAGE ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(var(--bg-rgb),.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.preview:not([hidden])~.view .topbar{top:34px}
.topbar .in{display:flex;align-items:center;gap:4px;max-width:760px;margin:0 auto;min-height:52px;padding:4px 6px}
.topbar .ib{flex:0 0 auto;width:44px;height:44px;border:none;background:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--teal-ink);cursor:pointer;text-decoration:none}
.topbar .ib:active{background:var(--teal-soft)}
.topbar .tname{flex:1 1 auto;min-width:0;text-align:center;font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.topbar.named .tname{opacity:1}
.panel{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:var(--shadow);max-height:min(62vh,520px);overflow-y:auto}
.topbar.open .panel{display:block}
.panel .chips{max-width:760px;margin:0 auto;padding:10px 14px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a{flex:0 1 auto;white-space:nowrap;text-decoration:none;font-size:.8rem;font-weight:600;color:var(--teal-ink);background:var(--card);border:1px solid var(--line);border-radius:999px;min-height:36px;padding:6px 12px;display:inline-flex;align-items:center;transition:background .15s,color .15s,border-color .15s}
.chips a.active{background:var(--teal);color:var(--on-teal);border-color:var(--teal)}
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;z-index:29;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.cathead{margin:18px 4px 12px}
.cathead h1{font-family:var(--display);font-weight:600;font-size:1.9rem;line-height:1.1;color:var(--terra);margin:0;letter-spacing:-.01em;text-wrap:balance}
.cathead .cnt{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:6px}
.cat-note{font-size:.84rem;color:var(--muted);margin:6px 0 0;font-style:italic}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;text-decoration:none;color:inherit;cursor:pointer;transition:background .15s}
.item:active{background:var(--teal-soft)}
.item+.item{border-top:1px solid var(--hair)}
.item .thumb{flex:0 0 auto;width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--skeleton)}
.item .body{flex:1 1 auto;min-width:0}
.item .row{display:flex;align-items:baseline;gap:10px}
.item .name{font-weight:600;font-size:1rem;flex:1 1 auto;min-width:0}
.item .price{font-weight:600;font-size:.98rem;color:var(--teal-ink);white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto}
.item .desc{font-size:.85rem;color:var(--muted);margin-top:2px;line-height:1.4}
.alg{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.alg span{font-size:.66rem;font-weight:600;letter-spacing:.01em;background:var(--tag-bg);color:var(--tag-ink);border:1px solid var(--tag-line);border-radius:999px;padding:2px 8px;line-height:1.45;white-space:nowrap}
.alg-inline{display:inline-flex;vertical-align:middle;margin:-2px 0 0 4px;position:relative;top:-1px}
.sub-h{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink);background:var(--teal-soft);padding:7px 14px}
.sub-h+.item{border-top:none}
.item.out .name,.item.out .desc,.item.out .alg,.item.out .thumb{opacity:.5}
.item.out .price{opacity:.6;text-decoration:line-through;text-decoration-thickness:1.5px}
.badge-out{flex:0 0 auto;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--terra);border:1.5px solid var(--terra);border-radius:6px;padding:2px 6px;line-height:1.3;align-self:center}
.pager{display:flex;gap:10px;margin:18px 0 0}
.pager a{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 12px;border:1px solid var(--line);background:var(--card);border-radius:14px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.pager a.next{justify-content:flex-end;text-align:right}
.pager a .k{display:block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pager a .v{display:block;font-weight:600;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager a .t{min-width:0}
.pager a .ar{flex:0 0 auto;color:var(--teal-ink)}
.pager a:empty,.pager a.none{visibility:hidden}
.empty{margin:30px 0;padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}

/* ---------- ITEM SHEET ---------- */
.sheet-scrim{position:fixed;top:0;right:0;bottom:0;left:0;z-index:70;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-width:760px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.28);max-height:86vh;max-height:86dvh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);outline:none}
.sheet.show{transform:none}
.sheet.drag{transition:none}
.sheet-head{padding:10px 16px 2px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.handle{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet-head .hrow{display:flex;align-items:flex-start;gap:10px}
.sheet-head h3{font-family:var(--display);font-weight:600;font-size:1.45rem;line-height:1.15;margin:0;flex:1 1 auto;min-width:0;letter-spacing:-.005em}
.sheet-head .close{flex:0 0 auto;width:36px;height:36px;border:none;border-radius:50%;background:var(--teal-soft);color:var(--teal-ink);cursor:pointer;font-size:1rem;display:inline-flex;align-items:center;justify-content:center}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 18px}
.sheet-body .sphoto{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;margin:6px 0 14px;background:var(--skeleton)}
.sheet-body .prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 0}
.sheet-body .sprice{font-weight:700;font-size:1.25rem;color:var(--teal-ink);font-variant-numeric:tabular-nums}
.sheet-body .sprice.out{text-decoration:line-through;opacity:.6}
.sheet-body .sdesc{margin:12px 0 0;font-size:.98rem;line-height:1.5;color:var(--ink)}
.sheet-body .snota{margin:10px 0 0;font-size:.9rem;color:var(--terra);font-weight:600}
.sheet-body .slbl{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 0}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions button{border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:40px;padding:6px 14px;font-size:.84rem;font-weight:600;color:var(--teal-ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}

/* ---------- skeleton / error ---------- */
.sk{margin:30px 0 0}
.sk .t{height:26px;width:46%;border-radius:8px;background:var(--skeleton);margin:0 0 10px 4px}
.sk .card{padding:4px 0}
.sk .r{height:46px;margin:0 14px;border-bottom:1px solid var(--hair);position:relative;overflow:hidden}
.sk .r::before{content:"";position:absolute;top:15px;left:0;height:12px;width:55%;border-radius:6px;background:var(--skeleton)}
.sk .r::after{content:"";position:absolute;top:15px;right:0;height:12px;width:12%;border-radius:6px;background:var(--skeleton)}
.sk .r:last-child{border-bottom:none}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.sk .card{position:relative}
.sk .card::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,var(--skeleton-hi),transparent);animation:shimmer 1.4s infinite}
.err{margin:30px 0;padding:18px;border:1px solid var(--terra);background:var(--terra-soft);border-radius:16px;text-align:center}
.err button{margin-top:10px;border:none;border-radius:999px;background:var(--teal);color:var(--on-teal);min-height:44px;padding:10px 18px;font-weight:600;cursor:pointer}

/* ---------- HOURS: live status, kitchen notes, weekly table ---------- */
.status-pill{display:inline-flex;align-items:center;gap:8px;margin-top:12px;min-height:36px;max-width:100%;padding:7px 14px 7px 12px;border-radius:18px;text-wrap:balance;border:1px solid var(--line);background:rgba(var(--bg-rgb),.86);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:.82rem;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;line-height:1.3}
.status-pill .dot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.status-pill.open .dot{background:var(--ok);animation:pulse 2.4s ease-out infinite}
.status-pill.kclosed .dot{background:var(--warn)}
.status-pill.closed .dot{background:var(--terra)}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ok-ring)}70%{box-shadow:0 0 0 7px rgba(0,0,0,0)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.kbar{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;padding:10px 12px;border-radius:14px;border:1px solid transparent;font-size:.9rem;font-weight:600;line-height:1.35;background:var(--teal-soft);color:var(--teal-ink)}
.kbar svg{flex:0 0 auto;margin-top:1px}
.kbar.off{background:var(--terra-soft);border-color:var(--terra);color:var(--ink)}
.kbar.shut{background:var(--card);border-color:var(--line);color:var(--muted)}
.hours{max-width:360px;margin:4px auto 0;text-align:left;scroll-margin-top:16px;border-radius:14px}
.hours.flash{animation:hflash 1.6s ease-out 1}
@keyframes hflash{0%{box-shadow:0 0 0 3px var(--teal)}100%{box-shadow:0 0 0 3px rgba(0,0,0,0)}}
.hours-h{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:6px}
.htab{width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem;line-height:1.35;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.htab th{font-size:.64rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px 6px;border-bottom:1px solid var(--hair)}
.htab td{padding:7px 10px;border-top:1px solid var(--hair);white-space:nowrap}
.htab tbody tr:first-child td{border-top:none}
.htab td:first-child{font-weight:600}
.htab td.k{color:var(--muted)}
.htab td.off{color:var(--muted);font-style:italic}
.htab tr.today td{background:var(--teal-soft);font-weight:700}
.htab tr.today td.k{color:var(--teal-ink)}
.hnote{font-size:.74rem;color:var(--muted);text-align:center;margin-top:6px}
.footer-info .place{margin-top:14px}

/* ---------- FOOTER ---------- */
.iva{text-align:center;font-size:.76rem;color:var(--muted);margin-top:22px}
.legal{margin-top:14px;padding:12px 8px 0;border-top:1px solid var(--hair);font-size:.72rem;color:var(--muted);text-align:center;line-height:1.5}
.footer{margin-top:26px;text-align:center;padding:20px 14px 0;border-top:1px solid var(--hair)}
.footer-brand{font-family:var(--display);font-weight:600;color:var(--terra);font-size:1.35rem}
.footer-info{margin-top:8px;font-size:.88rem;color:var(--muted);line-height:1.65}
.footer-info .map{display:inline-flex;align-items:center;gap:6px;margin-top:10px;min-height:44px;padding:10px 18px;border-radius:999px;background:var(--teal);color:var(--on-teal);font-weight:600;text-decoration:none;font-size:.9rem}
.updated{margin-top:14px;font-size:.72rem;color:var(--muted)}
.updated a{color:var(--muted)}

/* ---------- FLOATING ---------- */
.back-top{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:44px;height:44px;border-radius:50%;border:none;background:var(--teal);color:var(--on-teal);font-size:1.15rem;box-shadow:var(--shadow);cursor:pointer;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
.back-top.show{opacity:.94;transform:none;pointer-events:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.preview{position:sticky;top:0;z-index:60;background:var(--terra);color:#fff;text-align:center;font-size:.82rem;font-weight:700;padding:8px 12px;letter-spacing:.04em}

function parseCSV(text){ // RFC 4180: quoted fields may contain commas, quotes ("") and newlines

    else if(c==='"') q=true; else if(c===','){ row.push(field); field=""; }
    else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; } else if(c!=='\r') field+=c; }
  if(field!==""||row.length){ row.push(field); rows.push(row); }
  return rows;
}

function route(){
  var p=location.hash||"";
  if(p.indexOf("#preview")===0){ PREVIEW=true; p=p.slice(8).replace(/^\//,""); p=p?"#"+p:""; }
  if(p.indexOf("#it-")===0) return {view:"item",id:p.slice(4)};
  if(p.length>1) return {view:"cat",id:decodeURIComponent(p.slice(1))};
  return {view:"home"};
}

function render(soft){ // soft = same view re-rendered in place (language, filters, live data): no scroll change, no transition
  if(!DATA) return;
  var r=route();
  if(r.view==="item"){ var c=catOf(r.id); if(c) r.cat=c.id; else r={view:"home"}; }
  else if(r.view==="cat"&&!findCat(r.id)) r={view:"home"};
  var target=r.view==="home"?"home":"cat", tcat=target==="cat"?(r.cat||r.id):null;
  var changed=cur.view!==target||(target==="cat"&&cur.id!==tcat), d=depthOf(r), dir=d>cur.depth?"fwd":d<cur.depth?"back":"none";
  var apply=function(){
    if(cur.view==="home"&&target!=="home") homeY=window.scrollY;
    closePanel();
    if(target==="home"){ $("vCat").hidden=true; $("vHome").hidden=false; renderHome(); if(changed) scrollNow(cur.view===null?0:homeY); }
    else { $("vHome").hidden=true; $("vCat").hidden=false; renderCat(tcat); if(changed) scrollNow(0); }
    if(r.view==="item") openSheet(r.id,!changed&&cur.view==="cat"); else closeSheetUI();
    cur={view:target,id:tcat,depth:d}; updateFloating(); renderStatus();
  };
  if(changed&&!soft&&cur.view!==null&&document.startViewTransition&&!reduced()){ document.documentElement.setAttribute("data-dir",dir); document.startViewTransition(apply); }
  else apply();
}
window.addEventListener("hashchange",function(){
  if(clickNav){ clickNav=false; clearTimeout(clickT); try{ history.replaceState({inApp:true},""); }catch(e){} }
  render(false);
});
document.addEventListener("click",function(ev){ // in-app links push a history entry we can safely go back from
  var a=ev.target.closest("a[href]"); if(!a) return; var h=a.getAttribute("href")||""; if(h.charAt(0)!=="#") return;

    var a=dx<0?$("pager").querySelector("a.next"):$("pager").querySelector("a.prev"); if(a&&a.getAttribute("href")) goTo(a.getAttribute("href").replace(/^#preview\/?/,"#")); },{passive:true});
})();

$("home").addEventListener("click",function(ev){ var b=ev.target.closest(".gjump button"); if(!b) return; var h=$("grp-"+b.dataset.g); if(h) h.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"start"}); });

/* ---------- search ---------- */
var qT=null;
$("q").addEventListener("input",function(){ query=this.value; $("qClear").hidden=!query; clearTimeout(qT); qT=setTimeout(function(){ render(true); },120); });
$("qClear").addEventListener("click",function(){ $("q").value=""; query=""; this.hidden=true; render(true); $("q").focus(); });

/* ---------- floating ---------- */
var ticking=false;
function updateFloating(){ var bt=$("backTop"); if(bt) bt.classList.toggle("show",window.scrollY>700); if(cur.view==="cat") syncTopbar(); }
window.addEventListener("scroll",function(){ if(ticking) return; ticking=true; requestAnimationFrame(function(){ ticking=false; updateFloating(); }); },{passive:true});
$("backTop").addEventListener("click",function(){ closePanel(); window.scrollTo({top:0,behavior:reduced()?"auto":"smooth"}); });

applyStatic(); renderLangbar(); boot();
</script>
</body>
</html>
