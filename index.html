:root{
  --bg:#f3ebdb; --bg2:#ece1cc;
  --card:#fffdf8; --line:rgba(88,66,36,.12); --hair:rgba(88,66,36,.10);
  --ink:#22302f; --muted:#5b6866;
  --teal:#2f6b66; --teal-ink:#245a55; --teal-soft:rgba(47,107,102,.10);
  --terra:#a8502a;
  --tag-bg:#f5e6cd; --tag-ink:#6b431f; --tag-line:#e3cda6;
  --shadow:0 1px 2px rgba(50,36,12,.05),0 10px 28px -14px rgba(50,36,12,.22);
  --barH:52px;
  --display:"Fraunces",Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--bg);line-height:1.45}

/* ---------- HERO ---------- */
.hero{
  position:relative;height:clamp(270px,72vw,380px);
  background-color:#9cc0bc;background-size:cover;background-position:center 45%;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  text-align:center;padding:0 16px 18px;
}
.hero::after{
  content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,30,30,.10) 0%,rgba(20,30,30,0) 30%,rgba(243,235,219,0) 50%,rgba(243,235,219,.90) 76%,var(--bg) 100%);
}
@media(min-width:760px){.hero::after{background:linear-gradient(180deg,rgba(20,30,30,.10) 0%,rgba(20,30,30,0) 30%,rgba(243,235,219,0) 58%,rgba(243,235,219,.90) 82%,var(--bg) 100%)}}
.hero>*{position:relative;z-index:1}
.hero h1{
  font-family:var(--display);font-weight:600;font-size:clamp(2.5rem,11vw,3.4rem);
  line-height:1;margin:0;color:var(--ink);letter-spacing:-.01em;
}
.hero .sub{margin-top:8px;font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--teal-ink);font-weight:600}

/* ---------- LANGUAGE (not sticky) ---------- */
.langbar{display:grid;grid-template-columns:repeat(3,max-content);justify-content:center;gap:6px 8px;padding:14px 12px 6px;max-width:760px;margin:0 auto}
@media(min-width:480px){.langbar{grid-template-columns:repeat(6,max-content)}}
.langbar button{
  font:inherit;font-size:.8rem;font-weight:600;color:var(--ink);
  border:1px solid var(--line);background:var(--card);border-radius:999px;
  min-height:36px;padding:6px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:background .15s,color .15s,border-color .15s;
}
.langbar button .flag{font-size:1rem;line-height:1}
.langbar button.active{background:var(--teal);color:#fff;border-color:var(--teal)}

/* ---------- CATEGORY CHIPS (sticky) ---------- */
.chips-wrap{position:sticky;top:0;z-index:30;background:rgba(243,235,219,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hair)}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding:8px 12px;max-width:760px;margin:0 auto;scrollbar-width:none;scroll-behavior:smooth}
.chips::-webkit-scrollbar{display:none}
.chips a{
  flex:0 0 auto;white-space:nowrap;text-decoration:none;font-size:.82rem;font-weight:600;
  color:var(--teal-ink);background:var(--card);border:1px solid var(--line);border-radius:999px;
  min-height:36px;padding:7px 13px;display:inline-flex;align-items:center;
  transition:background .15s,color .15s,border-color .15s;
}
.chips a.active{background:var(--teal);color:#fff;border-color:var(--teal)}

/* ---------- MENU ---------- */
.wrap{max-width:760px;margin:0 auto;padding:4px 14px 72px}
section.cat{margin:30px 0 0;scroll-margin-top:calc(var(--barH) + 14px)}
h2.cat-title{font-family:var(--display);font-weight:600;font-size:1.5rem;line-height:1.15;color:var(--terra);margin:0 0 6px 4px;letter-spacing:-.005em}
.cat-note{font-size:.8rem;color:var(--muted);margin:-2px 0 10px 4px;font-style:italic}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.item{padding:11px 14px 11px}
.item+.item{border-top:1px solid var(--hair)}
.item .row{display:flex;align-items:baseline;gap:12px}
.item .name{font-weight:600;font-size:1rem;flex:1 1 auto;min-width:0}
.item .price{font-weight:600;font-size:.98rem;color:var(--teal-ink);white-space:nowrap;font-variant-numeric:tabular-nums;flex:0 0 auto}
.item .desc{font-size:.85rem;color:var(--muted);margin-top:2px;line-height:1.4}
.alg{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.alg span{font-size:.66rem;font-weight:600;letter-spacing:.01em;background:var(--tag-bg);color:var(--tag-ink);border:1px solid var(--tag-line);border-radius:999px;padding:2px 8px;line-height:1.45;white-space:nowrap}
.alg-inline{display:inline-flex;vertical-align:middle;margin:-2px 0 0 4px;position:relative;top:-1px}
.sub-h{font-family:var(--body);font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink);background:var(--teal-soft);padding:7px 14px}
.sub-h+.item{border-top:none}

/* ---------- FOOTER ---------- */
.iva{text-align:center;font-size:.76rem;color:var(--muted);margin-top:22px}
.legal{margin-top:14px;padding:12px 8px 0;border-top:1px solid var(--hair);font-size:.72rem;color:var(--muted);text-align:center;line-height:1.5}
.footer{margin-top:26px;text-align:center;padding:20px 14px 0;border-top:1px solid var(--hair)}
.footer-brand{font-family:var(--display);font-weight:600;color:var(--terra);font-size:1.35rem}
.footer-info{margin-top:8px;font-size:.88rem;color:var(--muted);line-height:1.65}
.footer-info .map{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;min-height:44px;padding:10px 18px;border-radius:999px;
  background:var(--teal);color:#fff;font-weight:600;text-decoration:none;font-size:.9rem;
}

/* ---------- BACK TO TOP ---------- */
.back-top{
  position:fixed;right:14px;bottom:16px;z-index:40;width:44px;height:44px;border-radius:50%;border:none;
  background:var(--teal);color:#fff;font-size:1.15rem;box-shadow:var(--shadow);cursor:pointer;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s;
}
.back-top.show{opacity:.94;transform:none;pointer-events:auto}

@media(min-width:760px){
  .hero{height:380px}
  .item{padding:12px 18px}
}
</style>

let LANG = (function(){
  let saved=null; try{ saved=localStorage.getItem("lunaLang"); }catch(e){}
  if(["pt","es","en","fr","de","nl"].includes(saved)) return saved;
  const nav=(navigator.language||"pt").slice(0,2).toLowerCase();
  return ["pt","es","en","fr","de","nl"].includes(nav)?nav:"pt";
})();

function renderLangbar(){
  const b=document.getElementById("langbar");
  b.innerHTML=LANGS.map(l=>`<button data-l="${l.code}" class="${l.code===LANG?'active':''}" title="${l.label}" aria-label="${l.label}" aria-pressed="${l.code===LANG}" onclick="setLang('${l.code}')"><span class="flag">${l.flag}</span>${l.code.toUpperCase()}</button>`).join("");
}
function syncOffsets(){
  const w=document.getElementById("chipsWrap");
  if(w) document.documentElement.style.setProperty("--barH",w.offsetHeight+"px");
}
window.addEventListener("resize",syncOffsets);
window.addEventListener("load",syncOffsets);

function renderChips(){
  const c=document.getElementById("chips");
  c.innerHTML=MENU.map(cat=>`<a href="#${cat.id}" data-cat="${cat.id}">${tv(cat.t,LANG)}</a>`).join("");
  c.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{
    setActiveChip(a.dataset.cat);
    lockUntil=Date.now()+900;                      // ignore intermediate positions during the smooth scroll
    setTimeout(()=>updateActive(true),950);        // then re-sync with wherever the page actually is
  }));
  activeCat=null; // chips were rebuilt — force re-highlight on next update
  syncOffsets();
}
function renderMenu(){
  const m=document.getElementById("menu");
  m.innerHTML=MENU.map(cat=>{
    let html=`<section class="cat" id="${cat.id}"><h2 class="cat-title">${tv(cat.t,LANG)}</h2>`;
    if(cat.note) html+=`<div class="cat-note">${tv(cat.note,LANG)}</div>`;
    html+=`<div class="card">`;
    cat.items.forEach(it=>{
      if(it.sub){ html+=`<div class="sub-h">${tv(it.sub,LANG)}</div>`; return; }
      const desc=it.d?`<div class="desc">${tv(it.d,LANG)}</div>`:"";
      let pills="";
      if(it.a&&it.a.length) pills=it.a.map(k=>`<span>${tv(ALG[k],LANG)}</span>`).join("");
      // allergen tags: inline after the name when there is no description, otherwise below the description
      const algInline=(pills&&!it.d)?` <span class="alg alg-inline" aria-label="${UI[LANG].alg}">${pills}</span>`:"";
      const algBlock=(pills&&it.d)?`<div class="alg" aria-label="${UI[LANG].alg}">${pills}</div>`:"";
      html+=`<div class="item"><div class="row"><div class="name">${tv(it.n,LANG)}${algInline}</div><div class="price">${it.p.replace('.',',')} €</div></div>${desc}${algBlock}</div>`;
    });
    html+=`</div></section>`;
    return html;
  }).join("");
  document.getElementById("ivaNote").textContent=UI[LANG].iva;
  document.getElementById("legalNote").textContent=UI[LANG].legal;
  document.getElementById("footerInfo").innerHTML=
    `🕙 ${UI[LANG].hours}<br>📍 ${UI[LANG].place}<br><a class="map" href="https://www.google.com/maps/search/?api=1&query=Luna+Bar+Praia+da+Vagueira" target="_blank" rel="noopener">🗺️ ${UI[LANG].map}</a>`;
  document.documentElement.lang=LANG;
  updateActive(true);
}
function setLang(l){ LANG=l; try{ localStorage.setItem("lunaLang",l); }catch(e){} renderLangbar(); renderChips(); renderMenu(); }

/* ---------- active category tracking ---------- */
let activeCat=null, lockUntil=0, ticking=false;
function setActiveChip(id){
  if(id===activeCat) return;
  activeCat=id;
  const bar=document.getElementById("chips");
  bar.querySelectorAll("a").forEach(a=>a.classList.toggle("active",a.dataset.cat===id));
  const chip=bar.querySelector(`a[data-cat="${id}"]`);
  if(chip){
    const left=chip.offsetLeft-(bar.clientWidth-chip.offsetWidth)/2;
    try{ bar.scrollTo({left:Math.max(0,left),behavior:"smooth"}); }catch(e){ bar.scrollLeft=Math.max(0,left); }
  }
}
function updateActive(force){
  if(!force && Date.now()<lockUntil) return;
  const barH=(document.getElementById("chipsWrap")||{}).offsetHeight||52;
  const y=window.scrollY+barH+24;
  const secs=document.querySelectorAll("section.cat");
  if(!secs.length) return;
  let cur=secs[0].id;
  secs.forEach(s=>{ if(s.offsetTop<=y) cur=s.id; });
  // at the very bottom, highlight the last category
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-2) cur=secs[secs.length-1].id;
  setActiveChip(cur);
  const bt=document.getElementById("backTop");
  if(bt) bt.classList.toggle("show",window.scrollY>700);
}
window.addEventListener("scroll",()=>{ if(ticking) return; ticking=true; requestAnimationFrame(()=>{ ticking=false; updateActive(false); }); },{passive:true});

renderLangbar(); renderChips(); renderMenu();
</script>
